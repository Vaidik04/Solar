[tool.poetry]
name = "solar-operations-os"
version = "0.1.0"
description = "Solar Operations OS — Multi-tenant platform for solar EPC companies"
authors = ["Solar OS Engineering <eng@solar-os.example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.35"}
alembic = "^1.13.3"
asyncpg = "^0.29.0"
pydantic = {extras = ["email"], version = "^2.9.0"}
pydantic-settings = "^2.5.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["argon2"], version = "^1.7.4"}
pyotp = "^2.9.0"
redis = {extras = ["hiredis"], version = "^5.0.8"}
arq = "^0.26.0"
boto3 = "^1.35.0"
python-multipart = "^0.0.12"
httpx = "^0.27.2"
structlog = "^24.4.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-instrumentation-fastapi = "^0.48b0"
opentelemetry-instrumentation-sqlalchemy = "^0.48b0"
opentelemetry-exporter-otlp = "^1.27.0"
prometheus-client = "^0.21.0"
python-ulid = "^2.7.0"
orjson = "^3.10.7"
pillow = "^10.4.0"
reportlab = "^4.2.2"
qrcode = {extras = ["pil"], version = "^8.0"}
PyYAML = "^6.0.2"
jsonschema = "^4.23.0"
cryptography = "^43.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
hypothesis = {extras = ["numpy"], version = "^6.112.0"}
testcontainers = {extras = ["postgresql"], version = "^4.8.0"}
factory-boy = "^3.3.1"
faker = "^30.3.0"
mypy = "^1.11.2"
ruff = "^0.6.8"
import-linter = "^2.1"
safety = "^3.2.7"
locust = "^2.31.8"
pytest-httpx = "^0.32.0"
anyio = {extras = ["trio"], version = "^4.6.0"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "ANN", "T20"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*", "tests/*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
