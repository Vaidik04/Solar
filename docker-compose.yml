version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: solar_postgres
    restart: always
    environment:
      POSTGRES_USER: solar_user
      POSTGRES_PASSWORD: solar_dev_password_123
      POSTGRES_DB: solar_operations
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar_user -d solar_operations"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: solar_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: solar_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password_123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: solar_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio_admin minio_password_123;
      mc mb local/solar-documents --ignore-existing;
      mc anonymous set download local/solar-documents;
      exit 0;
      "

  mailhog:
    image: mailhog/mailhog:latest
    container_name: solar_mailhog
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: solar_jaeger
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solar_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://solar_user:solar_dev_password_123@postgres:5432/solar_operations
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minio_admin
      - S3_SECRET_KEY=minio_password_123
      - S3_BUCKET_NAME=solar-documents
      - S3_REGION=ap-south-1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - SECRET_KEY=dev_secret_key_needs_to_be_at_least_32_bytes_long_12345
      - AUDIT_CHECKPOINT_SECRET=dev_audit_checkpoint_hmac_secret_32_bytes_min
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
